<script>
	var currentBookIndex = 0;
	var currentChapter = 1; // one based
	var chronoSequence = [];

	registerEventListener(
		(e) => e.name == "settingsUpdated",
		function (event) {
			applySettings();
		},
	);

	function matchYou(original, you, your, yours) {
		var form = "?";

		// all lower case
		if (original == "you") return you;
		if (original == "your") return your;
		if (original == "yours") return yours;

		// first letter capital
		if (original == "You") return you[0].toUpperCase() + you.substr(1);
		if (original == "Your") return your[0].toUpperCase() + your.substr(1);
		if (original == "Yours") return yours[0].toUpperCase() + yours.substr(1);

		// all capital
		if (original == "YOU") return you.toUpperCase();
		if (original == "YOUR") return your.toUpperCase();
		if (original == "YOURS") return yours.toUpperCase();

		return original;
	}

	var chronoIconSvg =
	'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

	function applySettings() {
		// Words of Christ (red letter)
		document.body.classList.toggle("woc-off", !settings.woc);

		// Chronological order indicator on chapter nav arrows
		document.body.classList.toggle(
			"chrono-nav",
			settings.order == "chronological",
		);

		// Titles
		if (settings.titles) {
			document
				.querySelectorAll(".hdg")
				.forEach((el) => (el.style.display = null));
		} else {
			document
				.querySelectorAll(".hdg")
				.forEach((el) => (el.style.display = "none"));
		}

		// Verses
		if (settings.verses) {
			document
				.querySelectorAll(".reftext")
				.forEach((el) => (el.style.display = null));
		} else {
			document
				.querySelectorAll(".reftext")
				.forEach((el) => (el.style.display = "none"));
		}

		// Cross references
		if (settings.references) {
			document
				.querySelectorAll(".cross1")
				.forEach((el) => (el.style.display = null));
		} else {
			document
				.querySelectorAll(".cross1")
				.forEach((el) => (el.style.display = "none"));
		}

		// Footnotes
		if (settings.footnotes) {
			document
				.querySelectorAll(".fn")
				.forEach((el) => (el.style.display = null));
		} else {
			document
				.querySelectorAll(".fn")
				.forEach((el) => (el.style.display = "none"));
		}

		// Spelling
		document
			.querySelectorAll(".spell")
			.forEach((el) => (el.style.display = "none"));
		document
			.querySelectorAll(".spell." + settings.spelling)
			.forEach((el) => (el.style.display = "inline"));

		// Case
		if (settings.case == "lower") {
			document
				.querySelectorAll(".cap")
				.forEach((el) => (el.style.display = "none"));
			document
				.querySelectorAll(".nocap")
				.forEach((el) => (el.style.display = "inline"));
			document
				.querySelectorAll(".bsb")
				.forEach((el) => (el.style.display = "none"));
		} else if (settings.case == "upper") {
			document
				.querySelectorAll(".cap")
				.forEach((el) => (el.style.display = "inline"));
			document
				.querySelectorAll(".nocap")
				.forEach((el) => (el.style.display = "none"));
			document
				.querySelectorAll(".bsb")
				.forEach((el) => (el.style.display = "none"));
		} else {
			document
				.querySelectorAll(".cap")
				.forEach((el) => (el.style.display = "none"));
			document
				.querySelectorAll(".nocap")
				.forEach((el) => (el.style.display = "none"));
			document
				.querySelectorAll(".bsb")
				.forEach((el) => (el.style.display = "inline"));
		}

		// God's name
		if (settings.name == "LORD") {
			document
				.querySelectorAll(".lord")
				.forEach((el) => (el.innerHTML = el.dataset.name));
			document
				.querySelectorAll(".caplord")
				.forEach((el) => (el.innerHTML = el.dataset.name));
		} else {
			document
				.querySelectorAll(".lord")
				.forEach((el) => (el.innerHTML = settings.name));
			document
				.querySelectorAll(".caplord")
				.forEach((el) => (el.innerHTML = settings.name.toUpperCase()));
		}

		// You plural
		document.querySelectorAll(".youpl").forEach((el) => {
			if (settings.you == "you")
				el.innerHTML = matchYou(el.dataset.word, "you", "your", "yours");
			if (settings.you == "youall")
				el.innerHTML = matchYou(
					el.dataset.word,
					"you all",
					"you all's",
					"you alls's",
				);
			if (settings.you == "yall")
				el.innerHTML = matchYou(
					el.dataset.word,
					"y'all",
					"y'all's",
					"y'alls's",
				);
			if (settings.you == "youguys")
				el.innerHTML = matchYou(
					el.dataset.word,
					"you guys",
					"you guy's",
					"you guys's",
				);
			if (settings.you == "youpl")
				el.innerHTML =
					matchYou(el.dataset.word, "you", "your", "yours") + "<sup>(pl)</sup>";

			if (settings.you == "youcoloured")
				el.innerHTML =
					"<span style='color:#00a7f9'>" +
					matchYou(el.dataset.word, "you", "your", "yours") +
					"</span>";
		});

		// You singular
		document.querySelectorAll(".yousg").forEach((el) => {
			if (settings.you == "youpl")
				el.innerHTML =
					matchYou(el.dataset.word, "you", "your", "yours") + "<sup>(sg)</sup>";
			else
				el.innerHTML = matchYou(el.dataset.word, "you", "your", "yours");
		});

		if (document.querySelectorAll(".version")) {
			document
				.querySelectorAll(".version")
				.forEach((el) => (el.innerHTML = getVersion()));
		}

		document.getElementById("body").style.fontSize = settings.fontSize + "px";

		setupPageTurn();
	}

	applySettings();

	function loadChapter(element) {
		var book = element.dataset.book;
		var slug = element.dataset.slug;
		var chapter = element.dataset.chapter;
		loadThisChapter(book, slug, chapter);
	}

	function loadThisChapter(book, slug, chapter) {
		var url = "./chapters/" + slug + "-" + chapter + ".html";
		var bookObj = books.find((b) => b.slug === slug);
		var hash = "#" + bookObj.abbr + "-" + chapter;
		history.pushState(hash, "", hash);

		updatePage(hash);

		fireEvent({
			name: "addBrowseHistory",
			data: {
				name: book,
				slug: slug,
				chapter: chapter,
				date: (new Date() + "").substr(0, 10),
			},
		});

		currentBookIndex = slugToIndex(slug);
		currentChapter = chapter;
		window.scrollTo(0, 0);
	}

	function moveChapter(delta) {
		if (settings.order == "chronological" && chronoSequence.length > 0) {
			var pos = -1;
			for (var i = 0; i < chronoSequence.length; i++) {
				if (
					chronoSequence[i].slug == books[currentBookIndex].slug &&
					chronoSequence[i].chapter == currentChapter
				) {
					pos = i;
					break;
				}
			}
			if (pos == -1) {
				pos = 0;
			} else {
				pos = (pos + delta + chronoSequence.length) % chronoSequence.length;
			}
			var target = chronoSequence[pos];
			loadThisChapter(target.name, target.slug, target.chapter);
			return;
		}

		currentChapter = parseInt(currentChapter) + parseInt(delta);
		if (currentChapter < 1) {
			currentBookIndex--;
			if (currentBookIndex < 0) {
				// went left from Genesis
				currentBookIndex = books.length - 1;
			}
			currentChapter = books[currentBookIndex].chapters;
		}
		if (currentChapter > books[currentBookIndex].chapters) {
			currentBookIndex++;
			if (currentBookIndex >= books.length) {
				// went right from Revelation
				currentBookIndex = 0;
			}
			currentChapter = 1;
		}

		loadThisChapter(
			books[currentBookIndex].name,
			books[currentBookIndex].slug,
			currentChapter,
		);
	}

	function titleCase(str) {
		return str
			.toLowerCase()
			.split(" ")
			.map(function (word) {
				return word.replace(word[0], word[0].toUpperCase());
			})
			.join(" ");
	}

	function slugToIndex(slug) {
		for (var i = 0; i < books.length; i++) {
			if (books[i].slug == slug) {
				return i;
			}
		}
		return 0;
	}

	function loadURL(url, skipHistory) {
		var chapter = document.getElementById("chapter");
		chapter.innerHTML = "";

		fetch(url)
			.then(function (response) {
				return response.text();
			})
			.then(function (text) {
				var fileName = url.split("/").pop();
				var withoutExt = fileName.slice(0, -5);
				var parts = withoutExt.split("-");
				var chapterNum = parts.pop();
				var slug = parts.join("-");
				var book = books.find((b) => b.slug === slug);
				var title = book
					? book.name + " " + chapterNum
					: titleCase(slug.replaceAll("-", " "));
				title = title.replace(" Of ", " of "); // Song of Solomon
				title = title + " (<span class='version'></span>)";
				chapter.innerHTML = addArrows(text, title);
				applySettings();

fireEvent({
				name: "showPage",
				page: "chapter",
				hash: book ? book.abbr + "-" + chapterNum : "",
				skipHistory: !!skipHistory,
			});

			// The page element is only laid out once the showPage event above has
			// made it visible, so measure the page dimensions now.
			if (pageTurning.enabled) {
				recalcPages();
			}

			// If we arrived here from a search result, scroll to that verse.
			if (window.scrollVerse) {
				var verseNum = window.scrollVerse;
				window.scrollVerse = null;
				if (pageTurning.enabled) {
					var pendingVerse = verseNum;
					setTimeout(function () {
						jumpToPageWithVerse(pendingVerse);
					}, 0);
				} else {
					var verseEl = document.getElementById("v" + verseNum);
					var scrollTarget = (verseEl && verseEl.closest("p")) || verseEl;
					if (scrollTarget) {
						setTimeout(function () {
							scrollTarget.scrollIntoView({ block: "center" });
						}, 0);
					}
				}
			}

			if (document.fonts && document.fonts.ready) {
				document.fonts.ready.then(function () {
					if (pageTurning.enabled) recalcPages();
				});
			}
			});
	}

	function getVersion() {
		var letter = settings.spelling.substr(0, 1).toUpperCase();
		if (letter == "G") letter = "B";

		var nameLetter = settings.name[0];
		if (settings.name == "G-d") nameLetter = "D";
		if (settings.name == "YHWH") nameLetter = "W";
		if (settings.name == "YHVH") nameLetter = "V";

		var upperLower = settings.case[0].toUpperCase();

		return "YCB-" + letter + nameLetter + upperLower;
	}

	function addArrows(html, title) {
		var arrows = `<div class="chapter-nav">
			<button data-cy="chapterLeft" onclick="moveChapter(-1)" aria-label="Previous chapter">
				<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
					<path d="M15.41 16.58L10.83 12L15.41 7.41L14 6L8 12L14 18L15.41 16.58Z" fill="currentColor"/>
				</svg>
				<span class="chrono-corner">${chronoIconSvg.replaceAll('"', "'")}</span>
			</button>
			<div id="chapterTitle"><span class="title-rule"></span><span class="title-text">${title}</span><span class="title-rule"></span></div>
			<button data-cy="chapterRight" onclick="moveChapter(1)" aria-label="Next chapter">
				<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
					<path d="M8.59 16.58L13.17 12L8.59 7.41L10 6L16 12L10 18L8.59 16.58Z" fill="currentColor"/>
				</svg>
				<span class="chrono-corner">${chronoIconSvg}</span>
		</button>
		</div>`;

		return (
			arrows +
			"<div id='chapterText'>" +
			html +
			"</div><div id='chapterSpacer' style='height:32px'></div>" +
			arrows.replace("chapter-nav", "chapter-nav bottom")
		);
	}

	var pageTurning = {
		enabled: false,
		page: 0, // zero based
		pageCount: 1,
		pageGap: 8,
	};

	var pageTurnArrows = {
		left:
			'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15.41 16.58L10.83 12L15.41 7.41L14 6L8 12L14 18L15.41 16.58Z" fill="currentColor"/></svg>',
		right:
			'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8.59 16.58L13.17 12L8.59 7.41L10 6L16 12L10 18L8.59 16.58Z" fill="currentColor"/></svg>',
	};

	function isChapterLoaded() {
		var chapter = document.getElementById("chapter");
		return chapter && !!chapter.querySelector("#chapterText");
	}

	function setupPageTurn() {
		if (!isChapterLoaded()) return;
		if (settings.pageturning) {
			enablePageTurn();
		} else {
			disablePageTurn();
		}
	}

	function enablePageTurn() {
		var chapter = document.getElementById("chapter");
		var textWrap = document.getElementById("chapterText");
		var spacer = document.getElementById("chapterSpacer");
		if (!chapter || !textWrap || !spacer) return;

		// The .page-turn class lives on #chapter and survives innerHTML resets,
		// so only treat the mode as already set up if the existing viewport is
		// connected to the current chapter content.
		var viewport = document.getElementById("pageTurnViewport");
		if (viewport && viewport.contains(textWrap)) {
			recalcPages();
			return;
		}

		var viewport = document.createElement("div");
		viewport.id = "pageTurnViewport";
		viewport.className = "page-turn-viewport";

		var controls = document.createElement("div");
		controls.id = "pageTurnControls";
		controls.className = "page-turn-controls";
		controls.innerHTML =
			'<button id="pageTurnLeft" class="page-turn-btn" aria-label="Previous page" onclick="turnPage(-1)">' +
			pageTurnArrows.left +
			"</button>" +
			'<div id="pageTurnDots" class="page-turn-dots"></div>' +
			'<div id="pageTurnCount" class="page-turn-count" aria-live="polite"></div>' +
			'<button id="pageTurnRight" class="page-turn-btn" aria-label="Next page" onclick="turnPage(1)">' +
			pageTurnArrows.right +
			"</button>";

		chapter.classList.add("page-turn");
		chapter.style.display = "flex";
		viewport.appendChild(textWrap);
		chapter.insertBefore(viewport, spacer);
		chapter.appendChild(controls);

		pageTurning.enabled = true;
		pageTurning.page = 0;
		recalcPages();
	}

	function disablePageTurn() {
		var chapter = document.getElementById("chapter");
		if (!chapter) return;
		var viewport = document.getElementById("pageTurnViewport");
		var controls = document.getElementById("pageTurnControls");
		var textWrap = document.getElementById("chapterText");
		var spacer = document.getElementById("chapterSpacer");

		chapter.classList.remove("page-turn");
		chapter.style.display = "block";
		if (viewport && textWrap && spacer) {
			chapter.insertBefore(textWrap, spacer);
			viewport.remove();
		}
		if (controls) controls.remove();
		pageTurning.enabled = false;
	}

	function recalcPages() {
		if (!pageTurning.enabled) return;
		var viewport = document.getElementById("pageTurnViewport");
		var textWrap = document.getElementById("chapterText");
		if (!viewport || !textWrap) return;

		var width = viewport.clientWidth;
		var height = viewport.clientHeight;
		if (!width || !height) return;

		var gap = pageTurning.pageGap;
		var step = width + gap;

		viewport.classList.add("no-anim");
		textWrap.style.height = height + "px";
		textWrap.style.columnWidth = width + "px";
		textWrap.style.columnGap = gap + "px";
		textWrap.style.columnFill = "auto";
		textWrap.style.webkitColumnFill = "auto";
		textWrap.style.transform = "";

		var scrollWidth = textWrap.scrollWidth;
		if (scrollWidth < width) scrollWidth = width;
		var pageCount = Math.max(1, Math.round((scrollWidth - width) / step) + 1);
		pageTurning.pageCount = pageCount;
		if (pageTurning.page > pageCount - 1) pageTurning.page = pageCount - 1;
		if (pageTurning.page < 0) pageTurning.page = 0;

		applyPageTransform(false);
		renderPageTurnIndicator();

		var viewportEl = viewport;
		requestAnimationFrame(function () {
			viewportEl.classList.remove("no-anim");
		});
	}

	function applyPageTransform(animate) {
		if (!pageTurning.enabled) return;
		var viewport = document.getElementById("pageTurnViewport");
		var textWrap = document.getElementById("chapterText");
		if (!viewport || !textWrap) return;
		var step = viewport.clientWidth + pageTurning.pageGap;
		viewport.classList.toggle("no-anim", !animate);
		textWrap.style.transform =
			"translateX(" + -pageTurning.page * step + "px)";
	}

	function renderPageTurnIndicator() {
		var dots = document.getElementById("pageTurnDots");
		var count = document.getElementById("pageTurnCount");
		if (!dots) return;
		var leftBtn = document.getElementById("pageTurnLeft");
		var rightBtn = document.getElementById("pageTurnRight");
		dots.innerHTML = "";
		var total = pageTurning.pageCount;
		var frag = document.createDocumentFragment();
		for (var i = 0; i < total; i++) {
			var dot = document.createElement("button");
			dot.type = "button";
			dot.className =
				"page-turn-dot" + (i === pageTurning.page ? " active" : "");
			dot.setAttribute("aria-label", "Go to page " + (i + 1));
			if (i === pageTurning.page)
				dot.setAttribute("aria-current", "true");
			dot.setAttribute("data-page", i);
			dot.onclick = (function (n) {
				return function () {
					goToPage(n);
				};
			})(i);
			frag.appendChild(dot);
		}
		dots.appendChild(frag);
		if (count) {
			count.textContent =
				pageTurning.page + 1 + " / " + pageTurning.pageCount;
		}
		if (leftBtn) leftBtn.disabled = pageTurning.page === 0;
		if (rightBtn) rightBtn.disabled = pageTurning.page >= total - 1;
	}

	function goToPage(n) {
		if (!pageTurning.enabled) return;
		n = Math.max(0, Math.min(n, pageTurning.pageCount - 1));
		if (n === pageTurning.page) return;
		pageTurning.page = n;
		applyPageTransform(true);
		renderPageTurnIndicator();
	}

	function turnPage(delta) {
		if (!pageTurning.enabled) return;
		goToPage(pageTurning.page + delta);
	}

	function jumpToPageWithVerse(verseNum) {
		if (!pageTurning.enabled) return;
		var el = document.getElementById("v" + verseNum);
		var textWrap = document.getElementById("chapterText");
		var viewport = document.getElementById("pageTurnViewport");
		if (!el || !textWrap || !viewport) return;
		var step = viewport.clientWidth + pageTurning.pageGap;
		var relLeft = el.getBoundingClientRect().left - textWrap.getBoundingClientRect().left;
		var page = Math.max(0, Math.floor(relLeft / step));
		goToPage(page);
	}

	window.addEventListener("resize", function () {
		if (pageTurning.enabled) recalcPages();
	});

	if (window.visualViewport) {
		window.visualViewport.addEventListener("resize", function () {
			if (pageTurning.enabled) recalcPages();
		});
	}

	window.addEventListener("keydown", function (event) {
		if (!pageTurning.enabled) return;
		var tag = (document.activeElement && document.activeElement.tagName) || "";
		if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
		if (event.key === "ArrowRight" || event.key === "PageDown") {
			event.preventDefault();
			goToPage(pageTurning.page + 1);
		} else if (event.key === "ArrowLeft" || event.key === "PageUp") {
			event.preventDefault();
			goToPage(pageTurning.page - 1);
		}
	});

	function createLink(name, slug, chapter, includeBook) {
		if (includeBook) {
			return `<a href='#' style='white-space:nowrap' data-slug='${slug}' data-book='${name}' data-chapter='${chapter}' onclick='loadChapter(this); return false'>${name} ${chapter}</a>`;
		} else {
			return `<a href='#' data-slug='${slug}' data-book='${name}' data-chapter='${chapter}' onclick='loadChapter(this); return false'>${chapter}</a>`;
		}
	}

	function toggleBookChapters(bookEl) {
		var chapters = bookEl.nextElementSibling;
		var isOpen = chapters.style.display == "flex";
		if (isOpen) {
			chapters.style.display = "none";
			bookEl.classList.toggle("open", !isOpen);
			return;
		}
		document.querySelectorAll(".index-chapters").forEach((el) => {
			el.style.display = "none";
		});
		document.querySelectorAll(".index-book.open").forEach((el) => {
			el.classList.remove("open");
		});
		chapters.style.display = "flex";
		bookEl.classList.add("open");
	}

	function makeTestamentSection(title) {
		var section = document.createElement("div");
		section.className = "index-section";
		section.innerHTML =
			"<div class='index-section-title'>" +
			title +
			"</div><div class='index-books'></div>";
		return section;
	}

	var order = settings.order;

	function applyOrderToUI() {
		document
			.querySelectorAll(".index-order-button")
			.forEach((b) => b.classList.toggle("active", b.id == "order-" + order));
		var canonical = document.getElementById("canonicalSections");
		var chrono = document.getElementById("chronoSections");
		var alpha = document.getElementById("alphabeticalSections");
		if (canonical) canonical.style.display = order == "canonical" ? "flex" : "none";
		if (chrono) chrono.style.display = order == "chronological" ? "flex" : "none";
		if (alpha) alpha.style.display = order == "alphabetical" ? "flex" : "none";
	}

	function setBibleOrder(newOrder) {
		order = newOrder;
		if (newOrder == "canonical" || newOrder == "chronological") {
			if (settings.order != newOrder) {
				fireEvent({
					name: "setSetting",
					setting: "order",
					value: newOrder,
				});
			}
		}
		applyOrderToUI();
	}

	registerEventListener(
		(e) => e.name == "settingsUpdated",
		function (event) {
			if (order != "alphabetical" && settings.order != order) {
				order = settings.order;
				applyOrderToUI();
			}
		}
	);

	function makeOrderPicker() {
		var picker = document.createElement("div");
		picker.className = "index-order";

		function orderButton(label, order) {
			var button = document.createElement("button");
			button.type = "button";
			button.className = "index-order-button";
			button.id = "order-" + order;
			button.textContent = label;
			button.onclick = function () {
				setBibleOrder(order);
			};
			return button;
		}

		picker.appendChild(orderButton("Canonical", "canonical"));
		picker.appendChild(orderButton("Chronological", "chronological"));
		picker.appendChild(orderButton("Alphabetical", "alphabetical"));
		return picker;
	}

	var canonicalSections = document.createElement("div");
	canonicalSections.id = "canonicalSections";
	canonicalSections.className = "index-sections";

	var oldTestament = makeTestamentSection("The Old Testament");
	var newTestament = makeTestamentSection("The New Testament");
	var oldBooks = oldTestament.querySelector(".index-books");
	var newBooks = newTestament.querySelector(".index-books");

	books.forEach(function (book, idx) {
		var bookDiv = document.createElement("div");
		bookDiv.className = "index-book-row";
		bookDiv.innerHTML =
			"<div class='index-book' data-book='" +
			book.name +
			"' onclick='toggleBookChapters(this)'>" +
			book.name +
			"</div>";
		var chapterLinks =
			"<div class='index-chapters' data-cy='" +
			book.name +
			"' style='display:none'>";
		for (let i = 1; i <= book.chapters; i++) {
			chapterLinks += createLink(book.name, book.slug, i) + " ";
		}
		chapterLinks += "</div>";
		bookDiv.innerHTML += chapterLinks;
		(idx < 39 ? oldBooks : newBooks).appendChild(bookDiv);
	});

	canonicalSections.appendChild(oldTestament);
	canonicalSections.appendChild(newTestament);

	var chronoSections = document.createElement("div");
	chronoSections.id = "chronoSections";
	chronoSections.className = "index-sections";

	var eraTitles = [
		"From Creation to the Law",
		"The Conquest and the Judges",
		"The United Kingdom",
		"From the Divided Kingdom to the Restoration",
		"The Life of Christ",
		"The Early Church",
	];
	var chronoSectionsMap = eraTitles.map(makeTestamentSection);
	var chronoBooks = chronoSectionsMap.map(function (section) {
		return section.querySelector(".index-books");
	});

	function otEraIndex(entry) {
		var name = entry.book;
		var first = entry.chapter[0];
		switch (name) {
			case "Genesis":
				return first == 1 ? 0 : 1;
			case "Job":
				return 1;
			case "Exodus":
			case "Leviticus":
			case "Numbers":
			case "Deuteronomy":
				return 2;
			case "Psalm":
			case "Psalms":
				if (first == 90) return 2;
				if (entry.chapter.indexOf(74) != -1) return 6;
				return 4;
			case "Joshua":
			case "Judges":
			case "Ruth":
				return 3;
			case "1 Samuel":
			case "2 Samuel":
			case "1 Chronicles":
				return 4;
			case "2 Chronicles":
				return first <= 9 ? 4 : 5;
			case "1 Kings":
				return first <= 11 ? 4 : 5;
			case "2 Kings":
				return first <= 23 ? 5 : 6;
			case "Proverbs":
			case "Ecclesiastes":
			case "Song of Solomon":
				return 4;
			case "Obadiah":
			case "Joel":
			case "Amos":
			case "Jonah":
			case "Hosea":
			case "Isaiah":
			case "Micah":
			case "Nahum":
			case "Zephaniah":
			case "Habakkuk":
				return 5;
			case "Jeremiah":
				return first <= 47 ? 5 : 6;
			case "Ezekiel":
			case "Daniel":
			case "Lamentations":
				return 6;
			case "Ezra":
			case "Haggai":
			case "Zechariah":
			case "Esther":
			case "Nehemiah":
			case "Malachi":
				return 7;
			default:
				return 0;
		}
	}

	function chronicleSectionIndex(book, entry) {
		var idx = books.indexOf(book);
		if (idx < 39) {
			var otGroup = [0, 0, 0, 1, 2, 3, 3, 3];
			return otGroup[otEraIndex(entry)];
		}
		if (idx <= 42) return 4;
		return 5;
	}

	function chronoBook(name) {
		var canonicalName = name == "Psalm" ? "Psalms" : name;
		return books.find((b) => b.name == canonicalName);
	}

	function formatChapterList(chapters) {
		chapters.sort((a, b) => a - b);
		if (chapters.length == 1) return "" + chapters[0];
		var groups = [];
		var start = chapters[0];
		var end = chapters[0];
		for (var i = 1; i < chapters.length; i++) {
			if (chapters[i] == end + 1) {
				end = chapters[i];
			} else {
				groups.push(start == end ? start : start + "-" + end);
				start = chapters[i];
				end = chapters[i];
			}
		}
		groups.push(start == end ? start : start + "-" + end);
		return groups.join(", ");
	}

	fetch("chronoChapters.json?version=1")
		.then(function (response) {
			return response.json();
		})
		.then(function (entries) {
			entries.forEach(function (entry, idx) {
				var book = chronoBook(entry.book);
				if (!book) {
					console.warn("ChronoChapters: unknown book " + entry.book);
					return;
				}
				var label =
					book.name == "Psalms" && entry.chapter.length >= 100
						? "Psalms (most)"
						: book.name + " " + formatChapterList(entry.chapter);
				var row = document.createElement("div");
				row.className = "index-book-row";
				row.innerHTML =
					"<div class='index-book' data-book='" +
					book.name +
					"' data-cy='chrono-" +
					idx +
					"' onclick='toggleBookChapters(this)'>" +
					label +
					"</div>";
				var chapterLinks =
					"<div class='index-chapters' data-cy='chronoChapters-" +
					idx +
					"' style='display:none'>";
				entry.chapter.forEach(function (chapter) {
					chapterLinks += createLink(book.name, book.slug, chapter) + " ";
					chronoSequence.push({
						name: book.name,
						slug: book.slug,
						chapter: chapter,
					});
				});
				chapterLinks += "</div>";
				row.innerHTML += chapterLinks;
				chronoBooks[chronicleSectionIndex(book, entry)].appendChild(row);
			});
			chronoSectionsMap.forEach(function (section) {
				chronoSections.appendChild(section);
			});
			setBibleOrder(order);
		});

	var alphabeticalSections = document.createElement("div");
	alphabeticalSections.id = "alphabeticalSections";
	alphabeticalSections.className = "index-sections";

	var sortedBooks = books.slice().sort(function (a, b) {
		return a.name < b.name ? -1 : a.name > b.name ? 1 : 0;
	});

	sortedBooks.forEach(function (book) {
		var bookDiv = document.createElement("div");
		bookDiv.className = "index-book-row";
		bookDiv.innerHTML =
			"<div class='index-book' data-book='" +
			book.name +
			"' data-cy='alpha-" +
			book.name +
			"' onclick='toggleBookChapters(this)'>" +
			book.name +
			"</div>";
		var chapterLinks =
			"<div class='index-chapters' data-cy='alphaChapters-" +
			book.name +
			"' style='display:none'>";
		for (let i = 1; i <= book.chapters; i++) {
			chapterLinks += createLink(book.name, book.slug, i) + " ";
		}
		chapterLinks += "</div>";
		bookDiv.innerHTML += chapterLinks;
		alphabeticalSections.appendChild(bookDiv);
	});

	document.getElementById("index").appendChild(makeOrderPicker());
	document.getElementById("index").appendChild(canonicalSections);
	document.getElementById("index").appendChild(chronoSections);
	document.getElementById("index").appendChild(alphabeticalSections);
	setBibleOrder(order);

	if (settings.browseHistory.length > 0) {
		let history = settings.browseHistory[settings.browseHistory.length - 1];

		var url = "./chapters/" + history.slug + "-" + history.chapter + ".html";
		loadURL(url);
		currentChapter = history.chapter;
		currentBookIndex = slugToIndex(history.slug);
	}
</script>
