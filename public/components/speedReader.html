<div id="speedWord" style="font-size: 48px; text-align: center; color: black">
	&nbsp;
</div>

<button
	id="pausePlayBtn"
	style="
		font-size: 32px;
		display: block;
		margin: 20px auto 0;
		padding: 10px 20px;
		cursor: pointer;
		border-radius: 10px;
	"
>
	&#x23F8;
</button>

<div
	id="currentVerse"
	style="
		margin-top: 12px;
		text-align: center;
		font-size: 18px;
		align-self: center;
	"
>
	Verse 1
</div>

<div style="display: flex; justify-content: center; gap: 10px; margin-top: 0px">
	<button
		id="prevVerseBtn"
		style="
			font-size: 24px;
			padding: 5px 10px;
			cursor: pointer;
			border-radius: 5px;
			color: black;
		"
	>
		&#171;
	</button>
	<button
		id="nextVerseBtn"
		style="
			font-size: 24px;
			padding: 5px 10px;
			cursor: pointer;
			border-radius: 5px;
			color: black;
		"
	>
		&#187;
	</button>
</div>

<script>
	console.log("loaded menu component");

	let index,
		words,
		isPaused,
		timeoutId,
		btn,
		prevBtn,
		nextBtn,
		verseStarts,
		reftexts,
		currentVerseIndex,
		currentVerseEnd,
		controlsInitialized = false;

	function initSpeedReaderControls() {
		if (controlsInitialized) return;
		controlsInitialized = true;

		btn = document.getElementById("pausePlayBtn");
		btn.onclick = () => {
			isPaused = !isPaused;
			btn.innerHTML = isPaused ? "&#x25B6;" : "&#x2016;";
			if (isPaused && timeoutId) {
				clearTimeout(timeoutId);
				timeoutId = null;
			}
			if (!isPaused && !timeoutId) {
				nextWord();
			}
		};

		prevBtn = document.getElementById("prevVerseBtn");
		nextBtn = document.getElementById("nextVerseBtn");

		prevBtn.addEventListener("click", () => {
			if (timeoutId) clearTimeout(timeoutId);
			if (currentVerseIndex > 0) {
				currentVerseIndex -= 1;
				index = verseStarts[currentVerseIndex];
				currentVerseEnd = verseStarts[currentVerseIndex + 1]
					? verseStarts[currentVerseIndex + 1] - 1
					: words.length - 1;
			}
			updateDisplay();
			if (!isPaused) nextWord();
		});

		nextBtn.addEventListener("click", () => {
			if (timeoutId) clearTimeout(timeoutId);
			if (currentVerseIndex < verseStarts.length - 1) {
				currentVerseIndex += 1;
				index = verseStarts[currentVerseIndex];
				currentVerseEnd = verseStarts[currentVerseIndex + 1]
					? verseStarts[currentVerseIndex + 1] - 1
					: words.length - 1;
			}
			updateDisplay();
			if (!isPaused) nextWord();
		});
	}

	function updateDisplay() {
		if (index < words.length) {
			document.getElementById("speedWord").innerText = words[index];
			const currentVerseStart = verseStarts.filter((v) => v <= index).pop();
			if (currentVerseStart !== undefined) {
				const verseIndex = verseStarts.indexOf(currentVerseStart);
				const verseNum = reftexts[verseIndex].textContent.trim();
				document.getElementById("currentVerse").innerText = "Verse " + verseNum;
			}
		}
	}

	function nextWord() {
		if (
			isPaused ||
			index >= words.length ||
			document.getElementById("speedReader").style.display == "none"
		) {
			timeoutId = null;
			return;
		}
		if (index > currentVerseEnd) {
			// advance to next verse
			let nextVerseIndex = currentVerseIndex + 1;
			if (nextVerseIndex < verseStarts.length) {
				index = verseStarts[nextVerseIndex];
				currentVerseIndex = nextVerseIndex;
				currentVerseEnd = verseStarts[nextVerseIndex + 1]
					? verseStarts[nextVerseIndex + 1] - 1
					: words.length - 1;
			} else {
				// end of chapter
				timeoutId = null;
				return;
			}
		}
		updateDisplay();
		const prevWord = words[index];
		index++;
		let delay = 200;
		if (prevWord) {
			if (prevWord.includes(",")) delay += 100;
			if (
				prevWord.includes(".") ||
				prevWord.includes("!") ||
				prevWord.includes("?")
			)
				delay += 300;
		}
		timeoutId = setTimeout(nextWord, delay);
	}

	document.addEventListener("click", () => {
		if (event.target.closest("#dotIcon")) {
			return;
		}

		if (event.target.closest("#speedReader")) {
			return;
		}

		document.getElementById("speedReader").style.display = "none";
	});

	registerEventListener(
		(e) => e.name == "dotIconClicked",
		function (event) {
			if (document.getElementById("speedReader").style.display == "block") {
				document.getElementById("speedReader").style.display = "none";
				return;
			}
			document.getElementById("speedReader").style.display = "block";
			startReading();
		},
	);

	function startReading() {
		const chapterElement = document.getElementById("chapter");
		if (!chapterElement) return;

		const chapterClone = chapterElement.cloneNode(true);

		// Remove bottom arrows to avoid duplicating the title
		if (
			chapterClone.lastElementChild &&
			chapterClone.lastElementChild.querySelector("#chapterTitle")
		) {
			chapterClone.lastElementChild.remove();
		}

		chapterClone.querySelectorAll("*").forEach((el) => {
			if (el.style.display === "none" && !el.classList.contains("reftext")) {
				el.remove();
			}
		});

		const reftextClones = chapterClone.querySelectorAll(".reftext");
		verseStarts = [];
		reftextClones.forEach((el) => {
			el.insertAdjacentText("afterend", " ");
			const range = document.createRange();
			range.setStart(chapterClone, 0);
			range.setEndBefore(el);
			const wordsBefore = range
				.toString()
				.split(/\s+/)
				.filter((word) => word.length > 0).length;
			verseStarts.push(wordsBefore);
			el.remove();
		});

		const text = chapterClone.innerText;
		words = text.split(/\s+/).filter((word) => word.length > 0);

		reftexts = chapterElement.querySelectorAll(".reftext");

		const reader = document.getElementById("speedReader");

		// Find the longest word to set fixed width
		const longestWord = words.reduce(
			(longest, current) =>
				current.length > longest.length ? current : longest,
			"",
		);
		const tempDiv = document.createElement("div");
		tempDiv.style.fontSize = "48px";
		tempDiv.style.fontFamily = "inherit";
		tempDiv.style.position = "absolute";
		tempDiv.style.visibility = "hidden";
		tempDiv.innerText = longestWord;
		document.body.appendChild(tempDiv);
		const wordWidth = tempDiv.offsetWidth;
		document.body.removeChild(tempDiv);
		const maxReaderWidth = Math.max(window.innerWidth - 40, 0);
		reader.style.boxSizing = "border-box";
		reader.style.maxWidth = maxReaderWidth + "px";
		reader.style.width = Math.min(wordWidth + 40, maxReaderWidth) + "px"; // 40px for padding

		isPaused = false;
		timeoutId = null;
		initSpeedReaderControls();

		currentVerseIndex = 0;
		currentVerseEnd = verseStarts[1] ? verseStarts[1] - 1 : words.length - 1;
		index = 0; // Start from the beginning to include the chapter title
		updateDisplay();
		nextWord(); // Start reading
	}
</script>
