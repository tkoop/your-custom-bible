<!-- Each row's icon is inline rather than a font or an image file: they are
     six outlines, they inherit the text colour in both themes, and the menu is
     the one place on the page where a reader is choosing between pages, so a
     picture of the page is worth more than its name alone. Drawn to the same
     24x24 stroke as the header buttons and the chapter arrows. -->
<div class="menu-item" onclick="fireEvent({name:'showPage', page:'home'})">
	<svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
		<path d="M3 10.5 12 3l9 7.5" />
		<path d="M5.5 9.5V20h13V9.5" />
		<path d="M9.5 20v-6h5v6" />
	</svg>
	<span>Home</span>
</div>

<div class="menu-item" onclick="fireEvent({name:'showPage', page:'index'})">
	<svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
		<path d="M4 4h5v16H4zM10 4h4v16h-4zM15 4h5v16h-5z" />
	</svg>
	<span>Index</span>
</div>

<div class="menu-item" onclick="goToTodaysChapter()" id="todaysChapterItem">
	<svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
		<circle cx="12" cy="12" r="9" />
		<path d="M12 7v5l3 2" />
	</svg>
	<span>Chapter of the Day</span>
</div>

<div class="menu-item" onclick="fireEvent({name:'showPage', page:'plans'})" data-cy="plansMenuItem">
	<svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
		<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z" />
		<path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z" />
	</svg>
	<span>Reading Plans</span>
</div>

<div class="menu-item" onclick="fireEvent({name:'showPage', page:'history'})">
	<svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
		<path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1" />
		<path d="M3.2 3.5V9h5.5" />
		<path d="M12 8v4.3l3 1.7" />
	</svg>
	<span>History</span>
</div>

<div class="menu-item" onclick="fireEvent({name:'showPage', page:'search'})">
	<svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
		<circle cx="11" cy="11" r="6.5" />
		<path d="m16 16 4.5 4.5" />
	</svg>
	<span>Search</span>
</div>

<hr class="menu-divider" />

<div class="menu-item" onclick="fireEvent({name:'showPage', page:'about'})">
	<svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
		<circle cx="12" cy="12" r="9" />
		<path d="M12 11v5.5" />
		<circle cx="12" cy="7.8" r="0.6" fill="currentColor" stroke="none" />
	</svg>
	<span>About</span>
</div>

<script>
	registerEventListener(
		(e) => e.name == "menuIconClicked",
		function (event) {
			event.eventObject.stopPropagation();
			document.getElementById("settingsDropdown").style.display = "none";
			const dd = document.getElementById("dropdown");
			dd.style.display = dd.style.display === "block" ? "none" : "block";
		}
	);

	function hideDropDown() {
		document.getElementById("dropdown").style.display = "none";
	}

	window.addEventListener("click", () => {
		hideDropDown();
		document.getElementById("settingsDropdown").style.display = "none";
	});
</script>
