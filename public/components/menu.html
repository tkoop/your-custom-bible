<div onclick="fireEvent({name:'showPage', page:'home'})">Home</div>

<div onclick="fireEvent({name:'showPage', page:'index'})">Index</div>

<div onclick="goToTodaysChapter()" id="todaysChapterItem">Chapter of the Day</div>

<div onclick="fireEvent({name:'showPage', page:'history'})">History</div>

<div onclick="fireEvent({name:'showPage', page:'search'})">Search</div>

<hr class="menu-divider" />

<div id="readToMeItem" data-cy="readToMeItem" style="display:none" onclick="fireEvent({name:'readToMeClicked'})">Read to me</div>

<div id="speedReadItem" style="display:none" onclick="fireEvent({name:'dotIconClicked'})">Speed Read</div>

<hr class="menu-divider" />

<div onclick="fireEvent({name:'showPage', page:'about'})">About</div>

<script>
	registerEventListener(
		(e) => e.name == "menuIconClicked",
		function (event) {
			event.eventObject.stopPropagation();
			document.getElementById("settingsDropdown").style.display = "none";
			const dd = document.getElementById("dropdown");
			dd.style.display = dd.style.display === "block" ? "none" : "block";
		}
	);

	function hideDropDown() {
		document.getElementById("dropdown").style.display = "none";
	}

	window.addEventListener("click", () => {
		hideDropDown();
		document.getElementById("settingsDropdown").style.display = "none";
	});

	// Both reading modes act on the chapter, so they only show on one.
	// Read to me also needs a browser that can speak.
	registerEventListener(
		(e) => e.name == "showPage",
		function (event) {
			var onChapter = event.page === "chapter";
			document.getElementById("speedReadItem").style.display = onChapter
				? "flex"
				: "none";
			document.getElementById("readToMeItem").style.display =
				onChapter &&
				typeof rtmSupported == "function" &&
				rtmSupported()
					? "flex"
					: "none";
		}
	);
</script>
