<div style="display: flex">
	<div>Activity</div>
	<div>
		<select
			style="padding: 6px; border-radius: 6px"
			id="activity"
			class="activity-select"
			aria-label="Activity type"
		></select>
	</div>
</div>

<div
	style="display: flex"
	onclick="var i = this.querySelector('input').click(); event.stopPropagation()"
>
	<div
		class="chrono-label"
		style="display: flex; align-items: center; gap: 6px"
	>Chronological
		<svg
			width="15"
			height="15"
			viewBox="0 0 24 24"
			fill="none"
			stroke="currentColor"
			stroke-width="2.2"
			stroke-linecap="round"
			stroke-linejoin="round"
			aria-hidden="true"
		>
			<circle cx="12" cy="12" r="9"></circle>
			<path d="M12 7v5l3 2"></path>
		</svg>
	</div>
	<div>
		<input
			type="checkbox"
			data-value="order"
			onchange="fireEvent({name:'setSetting', setting:'order', value:this.checked?'chronological':'canonical'})"
			onclick="event.stopPropagation()"
		/>
	</div>
</div>

<div
	style="display: flex"
	onclick="var i = this.querySelector('input').click(); event.stopPropagation()"
>
	<div>Page Turning</div>
	<div>
		<input
			type="checkbox"
			data-value="pageturning"
			onchange="fireEvent({name:'setSetting', setting:'pageturning', value:this.checked})"
			onclick="event.stopPropagation()"
		/>
	</div>
</div>

<div
	style="display: flex"
	onclick="var i = this.querySelector('input').click(); event.stopPropagation()"
>
	<div>Word study links</div>
	<div>
		<input
			type="checkbox"
			data-value="wordStudyLinks"
			onchange="fireEvent({name:'setSetting', setting:'wordStudyLinks', value:this.checked})"
			onclick="event.stopPropagation()"
		/>
	</div>
</div>

<div>
	<div>Font</div>
	<div>
		<select
			style="padding: 6px; border-radius: 6px"
			id="font"
			onclick="event.stopPropagation()"
			onchange="fireEvent({name:'setSetting', setting:'font', value:this.options[this.selectedIndex].value}); event.stopPropagation()"
		>
			<option value="sourceSerif">Source Serif (default)</option>
			<option value="ebGaramond">EB Garamond</option>
			<option value="literata">Literata</option>
			<option value="sura">Sura</option>
			<option value="atkinson">Atkinson Hyperlegible</option>
			<option value="openDyslexic">OpenDyslexic</option>
		</select>
	</div>
</div>

<div>
	<div>Font Size</div>
	<div class="buttonHolder">
		<button
			onclick="fireEvent({name:'setSetting', setting:'fontSize', value:settings.fontSize / 1.1}); event.stopPropagation()"
		>
			-
		</button>
		<button
			onclick="fireEvent({name:'setSetting', setting:'fontSize', value:settings.fontSize * 1.1}); event.stopPropagation()"
		>
			+
		</button>
	</div>
</div>

<div>
	<div>Mode</div>
	<div class="buttonHolder">
		<button
			class="mode-btn"
			data-mode="auto"
			onclick="fireEvent({name:'setSetting', setting:'mode', value:'auto'}); event.stopPropagation()"
		>
			Auto
		</button>
		<button
			class="mode-btn"
			data-mode="dark"
			onclick="fireEvent({name:'setSetting', setting:'mode', value:'dark'}); event.stopPropagation()"
		>
			Dark
		</button>
		<button
			class="mode-btn"
			data-mode="light"
			onclick="fireEvent({name:'setSetting', setting:'mode', value:'light'}); event.stopPropagation()"
		>
			Light
		</button>
	</div>
</div>

<hr class="menu-divider" />

<div id="readToMeItem" data-cy="readToMeItem" onclick="fireEvent({name:'readToMeClicked'})">Read to me</div>

<div id="speedReadItem" onclick="fireEvent({name:'dotIconClicked'})">Speed Read</div>

<div id="shareItem" data-cy="shareItem" onclick="fireEvent({name:'shareClicked'})">Share</div>

<hr class="menu-divider" />

<div
	style="display: flex"
	onclick="var i = this.querySelector('input').click(); event.stopPropagation()"
>
	<div>Show advanced menu</div>
	<div>
		<input
			type="checkbox"
			data-value="showAdvanced"
			onchange="fireEvent({name:'setSetting', setting:'showAdvanced', value:this.checked})"
			onclick="event.stopPropagation()"
		/>
	</div>
</div>

<script>
	// Like the gear menu, everything in here is about reading a chapter, so the
	// menu and its header button only exist on a chapter page.
	// Component scripts share the global scope, so this reads the page the
	// router published rather than keeping a copy that can fall behind.
	function advancedButton() {
		return document.getElementById("advancedIcon");
	}

	// The button shows only when the user asked for it to stick around. It is
	// also how the menu is dismissed again, so it stays put while the menu is
	// open: unticking the toggle cannot pull the button out from under the
	// click that did it.
	function applyAdvancedButton() {
		if (settings.showAdvanced && window.currentPage === "chapter")
			advancedButton().style.display = "block";
	}

	function hideAdvancedMenu() {
		document.getElementById("advancedDropdown").style.display = "none";
		advancedButton().style.display = "none";
		applyAdvancedButton();
	}

	function closeOtherDropDowns() {
		document.getElementById("dropdown").style.display = "none";
		document.getElementById("settingsDropdown").style.display = "none";
	}

	// Read to me needs a browser that can speak. readToMe.html defines the
	// check and loads after this one, so it is asked when the menu opens rather
	// than when this component loads.
	function applyReadingModes() {
		var canSpeak = typeof rtmSupported == "function" && rtmSupported();
		document.getElementById("readToMeItem").style.display = canSpeak
			? ""
			: "none";
	}

	function openAdvancedMenu() {
		closeOtherDropDowns();
		advancedButton().style.display = "block";
		applyReadingModes();
		document.getElementById("advancedDropdown").style.display = "block";
	}

	registerEventListener(
		(e) => e.name == "advancedIconClicked",
		function (event) {
			if (window.currentPage !== "chapter") return;
			event.eventObject.stopPropagation();
			const dd = document.getElementById("advancedDropdown");
			if (dd.style.display === "block") {
				hideAdvancedMenu();
			} else {
				openAdvancedMenu();
			}
		}
	);

	// "Advanced" in the gear menu hands over to this menu, and brings the
	// header button with it so the menu is dismissable the same way round.
	registerEventListener(
		(e) => e.name == "advancedMenuRequested",
		function (event) {
			if (window.currentPage !== "chapter") return;
			event.eventObject.stopPropagation();
			openAdvancedMenu();
		}
	);

	["gearIconClicked", "menuIconClicked"].forEach(function (name) {
		registerEventListener(
			(e) => e.name == name,
			function () {
				hideAdvancedMenu();
			}
		);
	});

	window.addEventListener("click", hideAdvancedMenu);

	document.querySelectorAll("select#font option").forEach((op) => {
		if (op.value == settings.font) op.selected = true;
	});

	document.querySelector("input[data-value=pageturning]").checked =
		settings.pageturning;
	document.querySelector("input[data-value=wordStudyLinks]").checked =
		settings.wordStudyLinks;
	document.querySelector("input[data-value=order]").checked =
		settings.order == "chronological";
	document.querySelector("input[data-value=showAdvanced]").checked =
		settings.showAdvanced;

	function updateModeButtons() {
		document.querySelectorAll("#advancedDropdown .mode-btn").forEach((btn) => {
			btn.classList.toggle("selected", btn.dataset.mode === settings.mode);
		});
	}

	registerEventListener(
		(e) => e.name == "settingsUpdated",
		function (event) {
			updateModeButtons();
			document.querySelector("input[data-value=order]").checked =
				settings.order == "chronological";
			document.querySelector("input[data-value=showAdvanced]").checked =
				settings.showAdvanced;
			applyAdvancedButton();
		}
	);

	// Both reading modes act on the chapter, and so does this whole menu, so
	// they are simply always listed here; see applyReadingModes.
	registerEventListener(
		(e) => e.name == "showPage",
		function (event) {
			hideAdvancedMenu();
		}
	);

	applyAdvancedButton();
	updateModeButtons();
	applyActivityControls();
</script>
