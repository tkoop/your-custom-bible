<!doctype html>
<html>
	<head>
		<meta name="encoding" content="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#34507a" />
		<title>Your Custom Bible</title>
		<link rel="stylesheet" href="style.css?version=4" />
		<link rel="icon" type="image/png" href="images/logo.png?version=1" />
		<link rel="manifest" href="manifest.json?version=2" />
	</head>

	<body>
		<div id="header">
			<div id="rightIcons">
				<div
					id="dotIcon"
					onclick="
						console.log('firing');
						fireEvent({ name: 'dotIconClicked', eventObject: event });
					"
				>
					<svg
						width="24"
						height="24"
						viewBox="0 0 24 24"
						fill="none"
						xmlns="http://www.w3.org/2000/svg"
					>
						<path
							d="M2.42012 12.7132C2.28394 12.4975 2.21584 12.3897 2.17772 12.2234C2.14909 12.0985 2.14909 11.9015 2.17772 11.7766C2.21584 11.6103 2.28394 11.5025 2.42012 11.2868C3.54553 9.50484 6.8954 5 12.0004 5C17.1054 5 20.4553 9.50484 21.5807 11.2868C21.7169 11.5025 21.785 11.6103 21.8231 11.7766C21.8517 11.9015 21.8517 12.0985 21.8231 12.2234C21.785 12.3897 21.7169 12.4975 21.5807 12.7132C20.4553 14.4952 17.1054 19 12.0004 19C6.8954 19 3.54553 14.4952 2.42012 12.7132Z"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
						/>
						<path
							d="M12.0004 15C13.6573 15 15.0004 13.6569 15.0004 12C15.0004 10.3431 13.6573 9 12.0004 9C10.3435 9 9.0004 10.3431 9.0004 12C9.0004 13.6569 10.3435 15 12.0004 15Z"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
						/>
					</svg>
				</div>

				<svg
					id="menuIcon"
					onclick="fireEvent({ name: 'menuIconClicked', eventObject: event })"
					xmlns="http://www.w3.org/2000/svg"
					xmlns:xlink="http://www.w3.org/1999/xlink"
					version="1.1"
					width="24"
					height="24"
					viewBox="0 0 24 24"
				>
					<path d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z" />
				</svg>
			</div>

			<div id="dropdown" style="text-align: left"></div>

			<div
				id="brand"
				onclick="fireEvent({ name: 'showPage', page: 'index' })"
			>
				<img src="images/logo.png?version=1" alt="" />
				<div id="brandText">
					<div class="brand-title">Your Custom Bible</div>
					<div class="brand-sub">Based on the Berean Study Bible</div>
				</div>
			</div>
		</div>

		<div id="body">
			<div id="index" class="page" style="display: flex"></div>
			<div id="history" class="page">History page</div>
			<div id="about" class="page"></div>
			<div id="chapter" class="page"></div>
		</div>

		<div id="speedReader" class="modal" style="display: none"></div>
	</body>

	<script src="framework.js?version=1"></script>
	<script src="settings.js?version=1"></script>
	<script src="books.js?version=1"></script>

	<script>
		async function loadComponents() {
			await loadComponent("dropdown", "components/menu.html?version=2");
			await loadComponent("chapter", "components/chapter.html?version=2");
			await loadComponent("about", "components/about.html?version=1");
			await loadComponent("history", "components/history.html?version=1");
			await loadComponent("speedReader", "components/speedReader.html?version=5");
		}
		loadComponents().then(() => {
			if (window.location.hash) {
				history.replaceState(window.location.hash, "", window.location.hash);
				updatePage(window.location.hash);
			} else {
				history.replaceState("#", "", "#");
				updatePage("#");
			}
		});

		window.addEventListener("popstate", (event) => {
			updatePage(event.state);
		});

		function updatePage(state) {
			if (state === "#") {
				fireEvent({ name: "showPage", page: "index", skipHistory: true });
			} else if (state === "#history") {
				fireEvent({ name: "showPage", page: "history", skipHistory: true });
			} else if (state === "#about") {
				fireEvent({ name: "showPage", page: "about", skipHistory: true });
			} else if (state && state.startsWith("#")) {
				// chapter hash like #Gen-1
				const hash = state.slice(1); // remove #
				const parts = hash.split("-");
				const abbr = parts[0].toUpperCase();
				const chapter = parts.slice(1).join("-");
				const book = books.find((b) => b.abbr.toUpperCase() === abbr);
				if (book && chapter) {
					const url = "chapters/" + book.slug + "-" + chapter + ".html";
					loadURL(url, true);
				} else {
					// invalid hash, go to index
					fireEvent({ name: "showPage", page: "index", skipHistory: true });
				}
			} else {
				// fallback to index
				fireEvent({ name: "showPage", page: "index", skipHistory: true });
			}
		}

		function setDarkMode(goToDarkMode) {
			if (goToDarkMode) {
				document.body.classList.add("dark");
			} else {
				document.body.classList.remove("dark");
			}
		}
		setDarkMode(settings.darkMode);

		registerEventListener(
			(event) => event.name == "settingsUpdated",
			function (event) {
				setDarkMode(settings.darkMode);
			},
		);

		registerEventListener(
			(event) => event.name == "showPage",
			function (event) {
				if (!event.skipHistory) {
					let hash;
					if (event.page === "index") hash = "#";
					else if (event.page === "history") hash = "#history";
					else if (event.page === "about") hash = "#about";
					else if (event.page === "chapter") hash = "#" + event.hash;
					history.pushState(hash, "", hash);
				}
				document
					.querySelectorAll(".page")
					.forEach((e) => (e.style.display = "none"));
				var page = document.getElementById(event.page);
				page.style.display = event.page === "index" ? "flex" : "block";
				window.scrollTo(0, 0);
				return;
			},
		);
	</script>

	<script>
		if (window.location.hostname != "localhost") {
			if ("serviceWorker" in navigator) {
				window.addEventListener("load", function () {
					navigator.serviceWorker
						.register("./serviceWorker.js?version=1", {
							scope: "./",
						})
						.then(
							function (registration) {
								console.log(
									"ServiceWorker registered successfully, scope: ",
									registration.scope,
								);
							},
							function (err) {
								console.log("ServiceWorker registration failed: ", err);
							},
						);
					window.IS_STANDALONE = window.matchMedia(
						"(display-mode: standalone)",
					).matches;
				});
			}
		}
	</script>
</html>
