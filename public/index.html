<!doctype html>
<html>
	<head>
		<meta name="encoding" content="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#ececb2ff" />
		<title>Your Custom Bible</title>
		<link rel="stylesheet" href="style.css?version=1" />
		<link rel="icon" type="image/png" href="images/logo.png?version=1" />
		<link rel="manifest" href="manifest.json?version=1" />
	</head>

	<body>
		<div id="header">
			<div id="rightIcons">
				<div
					id="dotIcon"
					onclick="
						console.log('firing');
						fireEvent({ name: 'dotIconClicked', eventObject: event });
					"
				>
					&#128906;
				</div>

				<svg
					id="menuIcon"
					onclick="fireEvent({ name: 'menuIconClicked', eventObject: event })"
					xmlns="http://www.w3.org/2000/svg"
					xmlns:xlink="http://www.w3.org/1999/xlink"
					version="1.1"
					width="24"
					height="24"
					viewBox="0 0 24 24"
				>
					<path d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z" />
				</svg>
			</div>

			<div id="dropdown" style="text-align: left"></div>

			<img
				onclick="fireEvent({ name: 'showPage', page: 'index' })"
				src="images/banner.png"
				style="cursor: pointer; height: 88%; margin-top: -4px"
			/>
		</div>

		<div id="body" style="font-family: &quot;sura&quot;, sans-serif">
			<div id="index" class="page" style="display: block"></div>
			<div id="history" class="page">History page</div>
			<div id="about" class="page"></div>
			<div id="chapter" class="page"></div>
		</div>

		<div id="speedReader" class="modal" style="display: none"></div>
	</body>

	<script src="framework.js"></script>
	<script src="settings.js"></script>
	<script src="books.js"></script>

	<script>
		async function loadComponents() {
			await loadComponent("dropdown", "components/menu.html");
			await loadComponent("chapter", "components/chapter.html");
			await loadComponent("about", "components/about.html");
			await loadComponent("history", "components/history.html");
			await loadComponent("speedReader", "components/speedReader.html");
		}
		loadComponents().then(() => {
			if (window.location.hash) {
				history.replaceState(window.location.hash, "", window.location.hash);
				updatePage(window.location.hash);
			} else {
				history.replaceState("#", "", "#");
				updatePage("#");
			}
		});

		window.addEventListener("popstate", (event) => {
			updatePage(event.state);
		});

		function updatePage(state) {
			if (state === "#") {
				fireEvent({ name: "showPage", page: "index", skipHistory: true });
			} else if (state === "#history") {
				fireEvent({ name: "showPage", page: "history", skipHistory: true });
			} else if (state === "#about") {
				fireEvent({ name: "showPage", page: "about", skipHistory: true });
			} else if (state && state.startsWith("#")) {
				// chapter hash like #Gen-1
				const hash = state.slice(1); // remove #
				const parts = hash.split("-");
				const abbr = parts[0].toUpperCase();
				const chapter = parts.slice(1).join("-");
				const book = books.find((b) => b.abbr.toUpperCase() === abbr);
				if (book && chapter) {
					const url = "chapters/" + book.slug + "-" + chapter + ".html";
					loadURL(url, true);
				} else {
					// invalid hash, go to index
					fireEvent({ name: "showPage", page: "index", skipHistory: true });
				}
			} else {
				// fallback to index
				fireEvent({ name: "showPage", page: "index", skipHistory: true });
			}
		}

		function setDarkMode(goToDarkMode) {
			if (goToDarkMode) {
				document.body.classList.add("dark");
			} else {
				document.body.classList.remove("dark");
			}
		}
		setDarkMode(settings.darkMode);

		registerEventListener(
			(event) => event.name == "settingsUpdated",
			function (event) {
				setDarkMode(settings.darkMode);
			},
		);

		registerEventListener(
			(event) => event.name == "showPage",
			function (event) {
				if (!event.skipHistory) {
					let hash;
					if (event.page === "index") hash = "#";
					else if (event.page === "history") hash = "#history";
					else if (event.page === "about") hash = "#about";
					else if (event.page === "chapter") hash = "#" + event.hash;
					history.pushState(hash, "", hash);
				}
				document
					.querySelectorAll(".page")
					.forEach((e) => (e.style.display = "none"));
				document.getElementById(event.page).style.display = "block";
				window.scrollTo(0, 0);
				return;
			},
		);
	</script>

	<script>
		if (window.location.hostname != "localhost") {
			if ("serviceWorker" in navigator) {
				window.addEventListener("load", function () {
					navigator.serviceWorker
						.register("./serviceWorker.js", {
							scope: "./",
						})
						.then(
							function (registration) {
								console.log(
									"ServiceWorker registered successfully, scope: ",
									registration.scope,
								);
							},
							function (err) {
								console.log("ServiceWorker registration failed: ", err);
							},
						);
					window.IS_STANDALONE = window.matchMedia(
						"(display-mode: standalone)",
					).matches;
				});
			}
		}
	</script>
</html>
