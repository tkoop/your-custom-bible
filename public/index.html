<!doctype html>
<html>
	<head>
		<meta name="encoding" content="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#34507a" />
		<title>Your Custom Bible</title>
		<link rel="stylesheet" href="style.css?version=12" />
		<link rel="icon" type="image/png" href="images/logo.png?version=4" />
		<link rel="manifest" href="manifest.json?version=2" />
	</head>

	<body>
		<div id="header">
			<div id="rightIcons">
				<svg
					id="gearIcon"
					onclick="fireEvent({ name: 'gearIconClicked', eventObject: event })"
					xmlns="http://www.w3.org/2000/svg"
					width="24"
					height="24"
					viewBox="0 0 24 24"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
					stroke-linecap="round"
					stroke-linejoin="round"
				>
					<circle cx="12" cy="12" r="3"></circle>
					<path
						d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
					></path>
				</svg>

				<svg
					id="menuIcon"
					onclick="fireEvent({ name: 'menuIconClicked', eventObject: event })"
					xmlns="http://www.w3.org/2000/svg"
					xmlns:xlink="http://www.w3.org/1999/xlink"
					version="1.1"
					width="24"
					height="24"
					viewBox="0 0 24 24"
				>
					<path d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z" fill="currentColor" />
				</svg>
			</div>

			<div id="dropdown" style="text-align: left"></div>

			<div id="settingsDropdown" style="text-align: left"></div>

			<div
				id="brand"
				onclick="fireEvent({ name: 'showPage', page: 'index' })"
			>
				<img src="images/logo.png?version=4" alt="" />
				<div id="brandText">
					<div class="brand-title">Your Custom Bible</div>
					<div class="brand-sub">Based on the Berean Standard Bible</div>
				</div>
			</div>
		</div>

		<div id="body">
<div id="index" class="page" style="display: flex"></div>
		<div id="history" class="page">History page</div>
		<div id="search" class="page"></div>
		<div id="about" class="page"></div>
			<div id="chapter" class="page"></div>
		</div>

		<div id="speedReader" class="modal" style="display: none"></div>
	</body>

	<script src="framework.js?version=1"></script>
	<script src="settings.js?version=3"></script>
	<script src="books.js?version=1"></script>

	<script>
		async function loadComponents() {
			await loadComponent("dropdown", "components/menu.html?version=8");
			await loadComponent("chapter", "components/chapter.html?version=7");
			await loadComponent("about", "components/about.html?version=2");
			await loadComponent("history", "components/history.html?version=1");
			await loadComponent("search", "components/search.html?version=1");
			await loadComponent(
				"settingsDropdown",
				"components/settings.html?version=2"
			);
			await loadComponent("speedReader", "components/speedReader.html?version=7");
		}
		loadComponents().then(() => {
			if (window.location.hash) {
				history.replaceState(window.location.hash, "", window.location.hash);
				updatePage(window.location.hash);
			} else {
				history.replaceState("#", "", "#");
				updatePage("#");
			}
		});

		window.addEventListener("popstate", (event) => {
			updatePage(event.state);
		});

		function updatePage(state) {
			if (state === "#") {
				fireEvent({ name: "showPage", page: "index", skipHistory: true });
			} else if (state === "#history") {
				fireEvent({ name: "showPage", page: "history", skipHistory: true });
			} else if (state === "#search") {
				fireEvent({ name: "showPage", page: "search", skipHistory: true });
			} else if (state === "#about") {
				fireEvent({ name: "showPage", page: "about", skipHistory: true });
			} else if (state && state.startsWith("#")) {
				// chapter hash like #Gen-1
				const hash = state.slice(1); // remove #
				const parts = hash.split("-");
				const abbr = parts[0].toUpperCase();
				const chapter = parts.slice(1).join("-");
				const book = books.find((b) => b.abbr.toUpperCase() === abbr);
				if (book && chapter) {
					const url = "chapters/" + book.slug + "-" + chapter + ".html";
					loadURL(url, true);
				} else {
					// invalid hash, go to index
					fireEvent({ name: "showPage", page: "index", skipHistory: true });
				}
			} else {
				// fallback to index
				fireEvent({ name: "showPage", page: "index", skipHistory: true });
			}
		}

		const darkModeQuery = window.matchMedia("(prefers-color-scheme: dark)");
		function applyMode() {
			var useDark =
				settings.mode === "auto"
					? darkModeQuery.matches
					: settings.mode === "dark";
			document.body.classList.toggle("dark", useDark);
		}
		darkModeQuery.addEventListener("change", applyMode);
		applyMode();

		registerEventListener(
			(event) => event.name == "settingsUpdated",
			function (event) {
				applyMode();
			},
		);

		registerEventListener(
			(event) => event.name == "showPage",
			function (event) {
				if (!event.skipHistory) {
					let hash;
					if (event.page === "index") hash = "#";
					else if (event.page === "history") hash = "#history";
					else if (event.page === "search") hash = "#search";
					else if (event.page === "about") hash = "#about";
					else if (event.page === "chapter") hash = "#" + event.hash;
					history.pushState(hash, "", hash);
				}
				document
					.querySelectorAll(".page")
					.forEach((e) => (e.style.display = "none"));
				var page = document.getElementById(event.page);
				page.style.display = event.page === "index" ? "flex" : "block";
				window.scrollTo(0, 0);
				return;
			},
		);
	</script>

	<script>
		if (window.location.hostname != "localhost") {
			if ("serviceWorker" in navigator) {
				window.addEventListener("load", function () {
					navigator.serviceWorker
						.register("./serviceWorker.js?version=1", {
							scope: "./",
						})
						.then(
							function (registration) {
								console.log(
									"ServiceWorker registered successfully, scope: ",
									registration.scope,
								);
							},
							function (err) {
								console.log("ServiceWorker registration failed: ", err);
							},
						);
					window.IS_STANDALONE = window.matchMedia(
						"(display-mode: standalone)",
					).matches;
				});
			}
		}
	</script>
</html>
